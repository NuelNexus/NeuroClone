# Fully local, low latency: LM Studio (or llama.cpp server) + Kokoro-FastAPI + VTube Studio + mic.
#   LM Studio: load a model, start the server (default http://localhost:1234/v1)
#   llama.cpp: llama-server -m model.gguf --port 1234 -c 8192 --cache-reuse 256
#   Kokoro:    docker run -p 8880:8880 ghcr.io/remsky/kokoro-fastapi-gpu
persona: nexa

llm:
  provider: openai
  base_url: http://localhost:1234/v1
  model: local-model     # whatever name your server reports (`neuroclone doctor` lists it)
  temperature: 0.85
  max_tokens: 300

memory:
  embedder: openai
  embed_base_url: http://localhost:1234/v1
  embed_model: text-embedding-nomic-embed-text-v1.5

tts:
  provider: openai
  base_url: http://localhost:8880/v1
  model: kokoro

stt:
  enabled: true
  model: base.en

avatar:
  enabled: true
  hotkeys: {happy: Smile, excited: Smile, angry: Angry, sad: Sad, surprised: Shock}
